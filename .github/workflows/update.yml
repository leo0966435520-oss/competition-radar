name: 更新比賽資料

on:
  schedule:
    - cron: "0 22 */3 * *"   # 每 3 天一次，台灣時間早上 6 點（UTC 22:00）
  workflow_dispatch:          # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: 抓取比賽
        env:
          CONTACT: ${{ vars.CONTACT_EMAIL }}
          MAX_PAGES: "5"
          DELAY: "3"
        run: python scraper/scrape.py
      - name: 有變動就存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "更新比賽資料 $(date +'%Y-%m-%d')"
          git push
