<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>比賽雷達｜幫學生找適合的比賽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FA; --sheet:#FFFFFF; --grid:#E4E9F0; --ink:#1E3A5F; --ink-2:#526A87; --line:#CCD6E3;
  --hl:#FFE066; --easy:#2E7D5B; --mid:#A86A12; --hard:#B23A48; --focus:#2563EB;
  --hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1620; --sheet:#152030; --grid:#1A2634; --ink:#DCE6F2; --ink-2:#9AAEC6; --line:#2A3A4F;
    --hl:#6E5A00; --easy:#63C49A; --mid:#E3AC50; --hard:#E8808C; --focus:#82AEFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1620; --sheet:#152030; --grid:#1A2634; --ink:#DCE6F2; --ink-2:#9AAEC6; --line:#2A3A4F;
  --hl:#6E5A00; --easy:#63C49A; --mid:#E3AC50; --hard:#E8808C; --focus:#82AEFF; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; font-family:var(--sans); color:var(--ink); line-height:1.6; font-size:16px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
.wrap{max-width:1100px; margin:0 auto; padding:28px 20px 60px}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}

header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:8px 24px; margin-bottom:24px}
h1{font-family:var(--hand); font-weight:700; font-size:clamp(2rem,5vw,2.8rem); line-height:1.15; margin:0}
h1 span{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%); padding:0 .1em}
.sub{color:var(--ink-2); margin:4px 0 0; font-size:.95rem}
.updated{color:var(--ink-2); font-size:.85rem; text-align:right}

.notice{background:var(--sheet); border:1.5px dashed var(--mid); border-radius:6px; padding:10px 14px; margin-bottom:18px; font-size:.92rem}
.notice[hidden]{display:none}

.layout{display:grid; grid-template-columns:300px 1fr; gap:24px; align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}

aside{background:var(--sheet); border:1px solid var(--line); border-radius:10px; padding:18px; position:sticky; top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:820px){aside{position:static}}
.group{margin-bottom:18px}
.group:last-child{margin-bottom:0}
.gtitle{font-family:var(--hand); font-size:1.15rem; margin:0 0 6px}
.hint{color:var(--ink-2); font-size:.8rem; margin:4px 0 0}
input[type=text],select{width:100%; font:inherit; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:8px 10px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font:inherit; font-size:.85rem; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:999px; padding:3px 11px; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
.seg{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:6px; overflow:hidden}
.seg button{font:inherit; font-size:.9rem; background:transparent; color:var(--ink); border:0; border-left:1px solid var(--line); padding:7px 4px; cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--sheet)}
label.check{display:flex; gap:8px; align-items:center; font-size:.9rem; cursor:pointer}
.row{display:flex; gap:6px}
.btn{font:inherit; font-size:.88rem; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:7px 12px; cursor:pointer; white-space:nowrap}
.btn.primary{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
.student{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.student button{font:inherit; font-size:.85rem; background:transparent; color:var(--ink); border:0; padding:3px 6px 3px 11px; cursor:pointer}
.student button.x{padding:3px 9px 3px 4px; color:var(--ink-2)}
.student.on{background:var(--hl)}

.bar{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px}
.count{font-family:var(--hand); font-size:1.25rem}
.bar select{width:auto}

ol.list{list-style:none; margin:0; padding:0; background:var(--sheet); border:1px solid var(--line); border-radius:10px}
.item{display:grid; grid-template-columns:76px 1fr; gap:16px; padding:16px 18px; border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.days{text-align:center; font-family:var(--hand); line-height:1.1; padding-top:2px}
.days b{display:block; font-size:2rem}
.days small{font-size:.8rem; color:var(--ink-2)}
.days.soon b{background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 90%,transparent 90%)}
.title{font-weight:700; font-size:1.05rem; margin:0 0 2px; text-decoration:none}
.title:hover{text-decoration:underline}
.org{color:var(--ink-2); font-size:.85rem; margin:0}
.summary{margin:6px 0; font-size:.93rem; max-width:62ch}
.tags{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:.82rem; color:var(--ink-2)}
.cat{border:1px solid var(--line); border-radius:4px; padding:0 6px; color:var(--ink)}
.lvl{font-weight:700}
.lvl.l1{color:var(--easy)} .lvl.l2{color:var(--mid)} .lvl.l3{color:var(--hard)}
.why{margin:8px 0 0; font-size:.85rem; background:var(--paper); border-left:3px solid var(--hl); padding:6px 10px; border-radius:0 6px 6px 0}
details.more{margin-top:6px; font-size:.85rem; color:var(--ink-2)}
details.more summary{cursor:pointer}
details.more p{margin:4px 0}
.actions{margin-top:8px; display:flex; gap:6px}
.empty{background:var(--sheet); border:1px solid var(--line); border-radius:10px; padding:28px; text-align:center}
.empty p{margin:4px 0}
@media (prefers-reduced-motion:no-preference){ .item{transition:background .15s} .item:hover{background:var(--paper)} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span>比賽雷達</span></h1>
      <p class="sub">從獎金獵人整理高中生能參加的比賽，依興趣和難易度幫每位學生挑。</p>
    </div>
    <div class="updated" id="updated">讀取中…</div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="layout">
    <aside aria-label="篩選條件">
      <div class="group">
        <p class="gtitle">學生</p>
        <div class="chips" id="students"></div>
        <div class="row" style="margin-top:8px">
          <input type="text" id="sname" placeholder="學生名字" aria-label="學生名字">
          <button class="btn" id="saveStudent">儲存條件</button>
        </div>
        <p class="hint">把目前的篩選存成這位學生的設定，下次點名字就套用。只存在這台電腦的瀏覽器。</p>
      </div>

      <div class="group">
        <p class="gtitle">興趣關鍵字</p>
        <input type="text" id="q" placeholder="例如：畫畫 環保 拍片">
        <p class="hint">輸入後會自動找相關比賽，並排在前面。可用空格分開多個。</p>
      </div>

      <div class="group">
        <p class="gtitle">類型</p>
        <div class="chips" id="cats"></div>
      </div>

      <div class="group">
        <p class="gtitle">難易度</p>
        <div class="seg" id="diffs">
          <button data-d="1" aria-pressed="true">入門</button>
          <button data-d="2" aria-pressed="true">進階</button>
          <button data-d="3" aria-pressed="true">挑戰</button>
        </div>
        <p class="hint">難易度由程式推估，每筆比賽都寫了判斷原因。</p>
      </div>

      <div class="group">
        <label class="check"><input type="checkbox" id="maybe" checked> 包含資格寫得不清楚的比賽</label>
      </div>
      <button class="btn" id="reset">清除條件</button>
    </aside>

    <main>
      <div class="bar">
        <span class="count" id="count"></span>
        <select id="sort" aria-label="排序">
          <option value="rec">最符合的在前</option>
          <option value="deadline">截止日近的在前</option>
          <option value="prize">獎金高的在前</option>
        </select>
      </div>
      <div id="results"></div>
    </main>
  </div>
</div>

<script>
// 和 scraper/scrape.py 的 CATEGORIES 對應；用來把「畫畫」這類口語興趣對到類型
const CATS = {
  "設計": ["設計","海報","插畫","平面","logo","視覺","包裝","字體","吉祥物","貼圖","畫畫","美編"],
  "寫作文學": ["徵文","文學","小說","散文","新詩","寫作","劇本","書評","作文","寫字","閱讀"],
  "影音攝影": ["影片","微電影","短片","動畫","影像","攝影","拍攝","youtube","podcast","短影音","拍片","剪輯","拍照"],
  "音樂表演": ["音樂","歌曲","創作曲","樂團","舞蹈","表演","歌唱","唱歌","跳舞"],
  "程式科技": ["程式","黑客松","hackathon","app","ai","人工智慧","資訊","機器人","創客","資安","科技","寫程式","電腦"],
  "科學研究": ["科展","科學","研究","實驗","數學","物理","化學","生物","專題","自然"],
  "商業企劃": ["企劃","創業","行銷","商業","提案","品牌","創意發想","經營"],
  "社會公益": ["公益","永續","sdgs","環保","社會","社區","人權","防詐","反毒","環境","志工","氣候"],
  "語言國際": ["英文","英語","演講","辯論","國際交流","外語","日文","朗讀","口說"],
  "藝術美術": ["繪畫","美術","書法","漫畫","藝術","手作","雕塑","畫畫"],
  "其他": []
};
const LEVEL = {1:"入門",2:"進階",3:"挑戰"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const state = {q:"", cats:new Set(), diffs:new Set([1,2,3]), maybe:true, sort:"rec", student:null};
let DATA = [];

// ---------- 學生設定（存在瀏覽器） ----------
function loadStudents(){ try{ return JSON.parse(localStorage.getItem("students") || "[]"); }catch{ return []; } }
function saveStudents(list){ try{ localStorage.setItem("students", JSON.stringify(list)); }catch{} }
function renderStudents(){
  const list = loadStudents();
  $("#students").innerHTML = list.length ? list.map((s,i) =>
    `<span class="student${state.student===s.name?" on":""}"><button data-i="${i}">${esc(s.name)}</button><button class="x" data-del="${i}" aria-label="刪除 ${esc(s.name)}">×</button></span>`
  ).join("") : `<span class="hint">還沒有存任何學生。</span>`;
}
$("#students").addEventListener("click", e => {
  const list = loadStudents();
  if (e.target.dataset.del !== undefined){
    const s = list.splice(+e.target.dataset.del, 1)[0];
    if (s && state.student === s.name) state.student = null;
    saveStudents(list); renderStudents(); return;
  }
  const s = list[+e.target.dataset.i]; if (!s) return;
  state.q = s.q; state.cats = new Set(s.cats); state.diffs = new Set(s.diffs); state.maybe = s.maybe; state.student = s.name;
  syncControls(); render(); renderStudents();
});
$("#saveStudent").addEventListener("click", () => {
  const name = $("#sname").value.trim();
  if (!name){ $("#sname").focus(); return; }
  const list = loadStudents().filter(s => s.name !== name);
  list.push({name, q:state.q, cats:[...state.cats], diffs:[...state.diffs], maybe:state.maybe});
  saveStudents(list); state.student = name; $("#sname").value = ""; renderStudents();
});

// ---------- 篩選控制 ----------
function syncControls(){
  $("#q").value = state.q;
  $("#maybe").checked = state.maybe;
  document.querySelectorAll("#cats .chip").forEach(b => b.setAttribute("aria-pressed", state.cats.has(b.dataset.c)));
  document.querySelectorAll("#diffs button").forEach(b => b.setAttribute("aria-pressed", state.diffs.has(+b.dataset.d)));
}
$("#cats").innerHTML = Object.keys(CATS).map(c => `<button class="chip" data-c="${c}" aria-pressed="false">${c}</button>`).join("");
$("#cats").addEventListener("click", e => {
  const c = e.target.dataset.c; if (!c) return;
  state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
  syncControls(); render();
});
$("#diffs").addEventListener("click", e => {
  const d = +e.target.dataset.d; if (!d) return;
  if (state.diffs.has(d) && state.diffs.size > 1) state.diffs.delete(d); else state.diffs.add(d);
  syncControls(); render();
});
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#maybe").addEventListener("change", e => { state.maybe = e.target.checked; render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("#reset").addEventListener("click", () => {
  Object.assign(state, {q:"", cats:new Set(), diffs:new Set([1,2,3]), maybe:true, student:null});
  syncControls(); render(); renderStudents();
});

// ---------- 推薦計分 ----------
const terms = q => q.toLowerCase().split(/[\s,，、;；]+/).filter(Boolean);
function match(item, ts){
  const hay = `${item.title} ${item.summary} ${item.organizer}`.toLowerCase();
  let score = 0; const why = new Set();
  for (const t of ts){
    if (hay.includes(t)){ score += 3; why.add(`內容提到「${t}」`); }
    for (const [c, kws] of Object.entries(CATS)){
      if (item.categories.includes(c) && (c.includes(t) || kws.some(k => k === t || (t.length > 1 && (k.includes(t) || t.includes(k)))))){
        score += 2; why.add(`「${t}」對應到${c}類`); break;
      }
    }
  }
  return {score, why:[...why]};
}
function daysLeft(d){
  if (!d) return null;
  return Math.ceil((new Date(d + "T23:59:59+08:00") - Date.now()) / 86400000);
}

// ---------- 畫面 ----------
function render(){
  const ts = terms(state.q);
  let rows = DATA.map(it => ({it, d:daysLeft(it.deadline), ...match(it, ts)}))
    .filter(r => r.d === null || r.d >= 0)
    .filter(r => state.maybe || r.it.high_school === "yes")
    .filter(r => state.diffs.has(r.it.difficulty))
    .filter(r => !state.cats.size || r.it.categories.some(c => state.cats.has(c)));
  const before = rows.length;
  if (ts.length) rows = rows.filter(r => r.score > 0);
  const byDeadline = (a,b) => (a.d ?? 9999) - (b.d ?? 9999);
  rows.sort(state.sort === "prize" ? (a,b) => (b.it.prize||0) - (a.it.prize||0)
          : state.sort === "deadline" ? byDeadline
          : (a,b) => (b.score - a.score) || byDeadline(a,b));

  $("#count").textContent = `找到 ${rows.length} 個比賽`;
  if (!rows.length){
    $("#results").innerHTML = `<div class="empty"><p><b>沒有符合條件的比賽</b></p><p>${
      ts.length && before ? `有 ${before} 個比賽符合類型和難易度，但內容沒提到「${esc(state.q)}」。換個說法試試，例如「畫畫」改成「插畫」。` :
      "試著多選幾個難易度，或勾選「包含資格寫得不清楚的比賽」。"}</p></div>`;
    return;
  }
  $("#results").innerHTML = `<ol class="list">${rows.map(({it,d,why}, i) => `
    <li class="item">
      <div class="days${d !== null && d <= 7 ? " soon" : ""}">${d === null ? `<small>未寫<br>截止日</small>` : d === 0 ? `<b>今天</b><small>截止</small>` : `<small>剩</small><b>${d}</b><small>天</small>`}</div>
      <div>
        <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
        <p class="org">${esc(it.organizer || "主辦單位未列出")}${it.deadline ? `，${it.deadline} 截止` : ""}</p>
        <p class="summary">${esc(it.summary)}</p>
        <div class="tags">
          <span class="lvl l${it.difficulty}">${LEVEL[it.difficulty]}</span>
          ${it.categories.map(c => `<span class="cat">${esc(c)}</span>`).join("")}
          ${it.prize ? `<span>獎金最高 ${it.prize.toLocaleString("zh-TW")} 元</span>` : ""}
          ${it.high_school === "maybe" ? `<span>資格請再確認</span>` : ""}
        </div>
        ${why.length ? `<p class="why">推薦原因：${why.map(esc).join("、")}</p>` : ""}
        <details class="more"><summary>難易度怎麼判斷的、參賽資格</summary>
          <p>${LEVEL[it.difficulty]}：${it.difficulty_reasons.map(esc).join("、")}</p>
          <p>${esc(it.eligibility || "原頁面沒找到參賽資格段落，請點進去確認。")}</p>
        </details>
        <div class="actions"><button class="btn" data-copy="${i}">複製給學生</button></div>
      </div>
    </li>`).join("")}</ol>`;
  $("#results").onclick = async e => {
    const i = e.target.dataset.copy; if (i === undefined) return;
    const {it} = rows[+i];
    const text = `${it.title}\n截止：${it.deadline || "請看原頁面"}\n${it.url}`;
    try{ await navigator.clipboard.writeText(text); e.target.textContent = "已複製"; }
    catch{ prompt("複製下面的文字：", text); }
    setTimeout(() => e.target.textContent = "複製給學生", 1500);
  };
}

async function load(){
  try{
    const r = await fetch("data.json", {cache:"no-store"});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    DATA = j.items || [];
    const t = j.updated ? new Date(j.updated) : null;
    $("#updated").textContent = t ? `資料更新：${t.toLocaleString("zh-TW",{dateStyle:"medium",timeStyle:"short"})}` : "";
    if (j.sample){
      $("#notice").hidden = false;
      $("#notice").textContent = "目前顯示的是範例資料。到 GitHub 的 Actions 頁面執行一次「更新比賽資料」，就會換成真正的比賽。";
    }
  }catch(err){
    $("#updated").textContent = "";
    $("#notice").hidden = false;
    $("#notice").textContent = `讀不到 data.json（${err.message}）。請確認網站是透過 GitHub Pages 開啟，而不是直接雙擊檔案。`;
  }
  render(); renderStudents();
}
load();
</script>
</body>
</html>
